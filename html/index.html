<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Projeto acadêmico de página institucional para a Casa do Caminho.">
  <title>Início | Casa do Caminho</title>
  <link rel="stylesheet" href="../css/estilos.min.css">
</head>
<body>
  <header>
    <strong>Casa do Caminho</strong>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">☰ <span>Menu</span></button>
    <nav id="menu-principal" aria-label="Navegação principal">
      <ul>
        <li><a href="#/">Início</a></li>
        <li><a href="#/projetos">Projetos</a></li>
        <li class="submenu-item">
          <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="submenu-participar">Participar ▾</button>
          <ul id="submenu-participar" class="submenu">
            <li><a href="#/projetos">Conhecer projetos</a></li>
            <li><a href="#/cadastro">Quero colaborar</a></li>
          </ul>
        </li>
        <li><a href="#/cadastro">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo-principal">
    <div id="app" aria-live="polite"></div>
  </main>

  <footer>
    <p>Casa do Caminho — Projeto acadêmico demonstrativo.</p>
    <p><a href="#/cadastro">Acessar cadastro</a></p>
  </footer>
  <template id="pagina-inicio">
    <h1>Casa do Caminho</h1>
    <p>Um espaço digital para apresentar iniciativas solidárias e aproximar pessoas interessadas em colaborar.</p>

    <section aria-labelledby="sobre">
      <h2 id="sobre">Quem somos</h2>
      <figure>
        <picture>
          <source srcset="../imagens/voluntarios.webp" type="image/webp">
          <img src="../imagens/voluntarios.jpg" width="1672" height="941"
            alt="Cinco voluntários organizando alimentos e roupas em caixas para doação">
        </picture>
        <figcaption>Imagem ilustrativa de uma atividade voluntária.</figcaption>
      </figure>
      <p>Este site acadêmico apresenta a Casa do Caminho como uma organização voltada à participação da comunidade e ao apoio por meio de ações solidárias.</p>
    </section>

    <section class="half" aria-labelledby="missao">
      <h2 id="missao">Nossa proposta</h2>
      <p>Facilitar o acesso a informações sobre iniciativas sociais e mostrar caminhos para quem deseja contribuir com doações ou trabalho voluntário.</p>
    </section>

    <section class="half" aria-labelledby="participar">
      <h2 id="participar">Como participar</h2>
      <p>Conheça as formas de apoio e escolha aquela que faz sentido para você.</p>
      <a class="button" href="#/projetos">Conhecer as iniciativas</a>
    </section>

    <section class="news-section" aria-labelledby="noticias-titulo">
      <h2 id="noticias-titulo">Atualizações do projeto</h2>
      <p>Exemplos acadêmicos de conteúdo que uma organização pode publicar.</p>
      <div id="filtros-noticias" class="news-filters" role="group" aria-label="Filtrar atualizações"></div>
      <div id="lista-noticias" class="news-grid"></div>
      <p id="noticias-feedback" class="news-feedback" role="status" aria-live="polite"></p>
    </section>
  </template>
  <template id="pagina-projetos">
    <h1>Projetos e formas de ajudar</h1>
    <p>Esta página apresenta possibilidades de participação no projeto acadêmico da Casa do Caminho.</p>

    <section aria-labelledby="participacao">
      <h2 id="participacao">Como participar</h2>
      <p>Existem diferentes maneiras de colaborar com uma iniciativa social. Escolha a opção de seu interesse para conhecer o próximo passo.</p>
      <aside class="notice" aria-label="Aviso sobre o cadastro">
        <strong>Aviso:</strong> esta página é um exercício acadêmico. O formulário verifica dados no navegador, mas não realiza um cadastro real.
      </aside>
      <button type="button" class="info-button" id="abrir-info">Como funciona este projeto?</button>
      <figure>
        <picture>
          <source srcset="../imagens/voluntarios.webp" type="image/webp">
          <img src="../imagens/voluntarios.jpg" width="1672" height="941"
            alt="Voluntários separando alimentos e roupas em caixas para doação">
        </picture>
        <figcaption>Imagem ilustrativa de colaboração comunitária.</figcaption>
      </figure>
    </section>

    <section class="initiative-grid" aria-labelledby="iniciativas">
      <h2 id="iniciativas">Frentes de apoio</h2>
    </section>

    <section aria-labelledby="proximo-passo">
      <h2 id="proximo-passo">Próximo passo</h2>
      <p>Escolha no formulário como gostaria de participar. Este projeto acadêmico não envia os dados cadastrados.</p>
      <a class="button" href="#/cadastro">Ir para o cadastro</a>
    </section>
  <dialog id="info-dialog" aria-labelledby="info-dialog-title">
    <h2 id="info-dialog-title">Sobre a Casa do Caminho</h2>
    <p>Esta é uma plataforma acadêmica demonstrativa. Você pode conhecer as iniciativas e testar o formulário com dados fictícios. Nenhuma informação é enviada ou armazenada.</p>
    <form method="dialog"><button type="submit">Entendi</button></form>
  </dialog>
  </template>
  <template id="pagina-cadastro">
    <h1>Cadastro para participar</h1>
    <p class="intro">Preencha seus dados para demonstrar interesse em doações ou voluntariado. Os campos marcados com * são obrigatórios.</p>
    <p class="intro"><strong>Atividade de demonstração:</strong> este formulário verifica o preenchimento no navegador, mas ainda não envia nem armazena dados. Para testar, use dados fictícios.</p>

    <form id="cadastro" action="#" method="post">
      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="grid">
          <div class="full">
            <label for="nome">Nome completo *</label>
            <input id="nome" name="nome" type="text" autocomplete="name" minlength="3" maxlength="100" required>
          </div>
          <div>
            <label for="nascimento">Data de nascimento *</label>
            <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required>
          </div>
          <div>
            <label for="cpf">CPF *</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off"
              placeholder="000.000.000-00" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
              title="Digite o CPF no formato 000.000.000-00" aria-describedby="cpf-ajuda" required>
            <p class="hint" id="cpf-ajuda">Formato: 000.000.000-00.</p>
          </div>
          <div>
            <label for="email">E-mail *</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="telefone">Celular *</label>
            <input id="telefone" name="telefone" type="tel" inputmode="numeric" autocomplete="tel"
              placeholder="(00) 00000-0000" maxlength="15" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
              title="Digite o celular no formato (00) 00000-0000" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <div class="grid">
          <div>
            <label for="cep">CEP *</label>
            <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code"
              placeholder="00000-000" maxlength="9" pattern="[0-9]{5}-[0-9]{3}"
              title="Digite o CEP no formato 00000-000" required>
          </div>
          <div>
            <label for="estado">Estado *</label>
            <select id="estado" name="estado" autocomplete="address-level1" required>
              <option value="">Selecione o estado</option>
              <option value="AC">Acre</option><option value="AL">Alagoas</option><option value="AP">Amapá</option>
              <option value="AM">Amazonas</option><option value="BA">Bahia</option><option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option><option value="MA">Maranhão</option><option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option><option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option><option value="PB">Paraíba</option><option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option><option value="PI">Piauí</option><option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option><option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option><option value="RR">Roraima</option><option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option><option value="SE">Sergipe</option><option value="TO">Tocantins</option>
            </select>
          </div>
          <div class="full">
            <label for="endereco">Endereço *</label>
            <input id="endereco" name="endereco" type="text" autocomplete="address-line1"
              placeholder="Rua e número" maxlength="120" required>
          </div>
          <div class="full">
            <label for="cidade">Cidade *</label>
            <input id="cidade" name="cidade" type="text" autocomplete="address-level2" maxlength="80" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Como deseja participar?</legend>
        <div class="choice">
          <input id="voluntario" name="participacao" type="radio" value="voluntariado" required>
          <label for="voluntario">Quero participar como voluntário</label>
        </div>
        <div class="choice">
          <input id="doador" name="participacao" type="radio" value="doacao">
          <label for="doador">Quero receber informações sobre doações</label>
        </div>
        <label for="mensagem">Mensagem (opcional)</label>
        <textarea id="mensagem" name="mensagem" rows="4" maxlength="500" placeholder="Conte brevemente como gostaria de ajudar."></textarea>
      </fieldset>

      <button type="submit">Verificar cadastro</button>
      <p id="resultado" role="status" aria-live="polite"></p>
    </form>
  </template>
  <script src="../js/navegacao.min.js" defer></script>
  <script src="../js/componentes.min.js" defer></script>
  <script src="../js/cadastro.min.js" defer></script>
  <script src="../js/persistencia.min.js" defer></script>
  <script src="../js/templates.min.js" defer></script>
  <script src="../js/noticias.min.js" defer></script>
  <script src="../js/spa.min.js" defer></script>
</body>
</html>
